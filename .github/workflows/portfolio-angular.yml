name: Build portfolio Angular

on:
  push:
    branches: [main, master]
    paths:
      - 'Cours HTML CSS/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: 'Cours HTML CSS'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'Cours HTML CSS/package.json'

      - name: Install dependencies
        run: npm install

      - name: Build and prepare for GitHub Pages
        run: npm run deploy

      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore(portfolio): build Angular for GitHub Pages"
          git push
